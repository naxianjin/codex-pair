interface:
  display_name: "Codex Pair"
  short_description: "仅两个既有 OpenAI 或 DeepSeek 官方 CLI 窗口协作、交付与接续"
  default_prompt: "使用 $codex-pair 协调当前打开的两个官方 Codex CLI 窗口：本窗口发起 A 并输出给 B 的加入指令，收到邀请的原窗口直接加入，保留各自的 OpenAI 账号或已配置 DeepSeek API 环境。已授权步骤直接推进，缺失信息先向统筹方报告；工具权限仍以目标会话实际设置为准。"
policy:
  allow_implicit_invocation: true
